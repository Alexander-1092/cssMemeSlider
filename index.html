<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cssMemeSlider</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1>CSS Meme Slider</h1>
        </div>
    </header>
    <main class="main">
        <div class="container">
            <div class="slider">
                <input id="slide-one" type="radio" name="slider" checked>
                <input id="slide-two" type="radio" name="slider">
                <input id="slide-three" type="radio" name="slider">
                <input id="slide-four" type="radio" name="slider">
                <input id="slide-five" type="radio" name="slider">
                <input id="slide-six" type="radio" name="slider">
                <div class="slide slider__slide1">
                    <img src="./mems/1662033801146779379.jpg" alt="mem">
                </div>

                <div class="slide slider__slide2">
                    <img src="./mems/1673589193164914427.jpg" alt="mem">
                </div>
                <div class="slide slider__slide3">
                    <img src="./mems/1703502068135188131.jpg" alt="mem">
                </div>
                <div class="slide slider__slide4">
                    <img src="./mems/1708498901117884401.png" alt="mem">
                </div>
                <div class="slide slider__slide5">
                    <img src="./mems/ac3cb739cfa3a3afe74751efc42291ef (1).jpeg" alt="mem">
                </div>
                <div class="slide slider__slide6">
                    <img src="./mems/htmlLa.png" alt="mem">
                </div>
                <div class="bottom-slider">

                    <div class="box__text">
                        <span class="slider__text">text 1</span>
                        <span class="slider__text">text 2</span>
                        <span class="slider__text">text 3</span>
                        <span class="slider__text">text 4</span>
                        <span class="slider__text">text 5</span>
                        <span class="slider__text">text 6</span>
                    </div>

                    <div class="box__label">
                        <label for="slide-one" class="slider__box">
                            <span class="btn"></span>
                        </label>
                        <label for="slide-two" class="slider__box">
                            <span class="btn"></span>
                        </label>
                        <label for="slide-three" class="slider__box">
                            <span class="btn"></span>
                        </label>
                        <label for="slide-four" class="slider__box">
                            <span class="btn"></span>
                        </label>
                        <label for="slide-five" class="slider__box">
                            <span class="btn"></span>
                        </label>
                        <label for="slide-six" class="slider__box">
                            <span class="btn"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>@Все права защищены</p>
            <a href="https://github.com/Alexander-1092?tab=repositories" target="_blank">Мой гитхаб</a>
        </div>
    </footer>
</body>

</html>
