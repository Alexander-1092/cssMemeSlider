<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cssMemeSlider</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1>CSS Meme Slider</h1>
        </div>
    </header>
    <main class="main">
        <div class="container">
            <div class="slider">
                <input id="slide-one" type="radio" name="slider">
                <input id="slide-two" type="radio" name="slider">
                <div class="slide slider__slide1">
                    <img src="./mems/1547192201120218378.jpg" alt="">
                </div>

                <div class="slide slider__slide2">
                    <img src="./mems/1662033801146779379.jpg" alt="">
                </div>
                <div class="bottom-slider">

                    <div class="box__text">
                        <span class="slider__text">text 1</span>
                        <span class="slider__text">text 2</span>
                    </div>

                    <div class="box__label">
                        <label for="slide-one" class="slider__box">
                            <span class="btn"></span>
                        </label>
                        <label for="slide-two" class="slider__box">
                            <span class="btn"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>@Все права защищены</p>
            <a href="https://github.com/Alexander-1092?tab=repositories" target="_blank">Мой гитхаб</a>
        </div>
    </footer>
</body>

</html>
