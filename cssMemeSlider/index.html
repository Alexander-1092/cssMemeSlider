<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cssMemeSlider</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1>CSS Meme Slider</h1>
        </div>
    </header>
    <main class="main">
        <div class="container">
            <div class="slider">
                <input id="slide-one" type="radio" name="slider" checked>
                <input id="slide-two" type="radio" name="slider">
                <input id="slide-three" type="radio" name="slider">
                <input id="slide-four" type="radio" name="slider">
                <input id="slide-five" type="radio" name="slider">
                <input id="slide-six" type="radio" name="slider">


                <div class="slider__track">
                    <div class="slide slider__slide1">
                        <img src="./mems/1662033801146779379.jpg" alt="mem">
                    </div>
                    <div class="slide slider__slide2">
                        <img src="./mems/1673589193164914427.jpg" alt="mem">
                    </div>
                    <div class="slide slider__slide3">
                        <img src="./mems/1703502068135188131.jpg" alt="mem">
                    </div>
                    <div class="slide slider__slide4">
                        <img src="./mems/1708498901117884401.png" alt="mem">
                    </div>
                    <div class="slide slider__slide5">
                        <img src="./mems/ac3cb739cfa3a3afe74751efc42291ef (1).jpeg" alt="mem">
                    </div>
                    <div class="slide slider__slide6">
                        <img src="./mems/htmlLa.png" alt="mem">
                    </div>
                </div>

                <div class="bottom-slider">

                    <div class="box__text">
                        <span class="slider__text">
                            А это вот мои проекты
                            <a href="https://github.com/Alexander-1092?tab=repositories">вот тут</a> они просто
                            &#128293;
                        </span>
                        <span class="slider__text">Я делаю это максимально неуважительно &#128073; Ctrl+C и
                            Ctrl+V</span>
                        <span class="slider__text">Когда решил чуть-чуть исправить слайдер &#128516; </span>
                        <span class="slider__text">Да ну нафиг, жесть какая &#128552;</span>
                        <span class="slider__text">Во славу Сатане &#128520;</span>
                        <span class="slider__text">
                            <code>
                                &lt;p&gt;Hello world!&lt;/p&gt;
                            </code> - я программист!&#129497;
                        </span>
                    </div>

                    <div class="box__label">
                        <label for="slide-one" class="slider__box">
                            <span class="pseudo_btn">
                                <span class="btn">
                                </span>
                            </span>
                        </label>
                        <label for="slide-two" class="slider__box">
                            <span class="pseudo_btn">
                                <span class="btn">
                                </span>
                            </span>
                        </label>
                        <label for="slide-three" class="slider__box">
                            <span class="pseudo_btn">
                                <span class="btn">
                                </span>
                            </span>
                        </label>
                        <label for="slide-four" class="slider__box">
                            <span class="pseudo_btn">
                                <span class="btn">
                                </span>
                            </span>
                        </label>
                        <label for="slide-five" class="slider__box">
                            <span class="pseudo_btn">
                                <span class="btn">
                                </span>
                            </span>
                        </label>
                        <label for="slide-six" class="slider__box">
                            <span class="pseudo_btn">
                                <span class="btn">
                                </span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p class="footer__text"> &#169;Все права защищены</p>
        </div>
    </footer>
</body>

</html>
